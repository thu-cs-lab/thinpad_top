variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build
  - clean

bitstream:
  stage: build
  tags:
    - cod24-ci-runner
  script:
    - /opt/Xilinx/Vivado/2024.2/bin/vivado -mode tcl -source .ci-scripts/bits.tcl thinpad_top.xpr
    - python3 ./.ci-scripts/run-linter.py thinpad_top.xpr 2>linter.log
    - test -f thinpad_top.runs/impl_1/*.bit

  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    when: always
    paths:
      - thinpad_top.runs/impl_1/*.bit
      - thinpad_top.runs/*/runme.log
      - linter.log

clean_job:
  stage: clean
  tags:
    - cod24-ci-runner
  script:
    - rm -rf $PWD
  dependencies:
    - bitstream
